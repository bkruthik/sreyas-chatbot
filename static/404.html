<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Sreyas Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', -apple-system, sans-serif;
    background: linear-gradient(135deg, #e8f0fe 0%, #f0f4ff 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center; color: #202124;
  }
  .card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    padding: 48px 36px; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    max-width: 460px; width: 100%; border: 1px solid rgba(255,255,255,0.8);
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 26px; font-weight: 700; color: #1a73e8; margin-bottom: 8px; }
  p { font-size: 14.5px; color: #5f6368; line-height: 1.6; margin-bottom: 24px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #1a73e8, #4285f4);
    color: #fff; text-decoration: none; font-weight: 600;
    padding: 12px 24px; border-radius: 24px; font-size: 14px;
    box-shadow: 0 4px 14px rgba(26,115,232,0.35); transition: all 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,115,232,0.45); }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🔍</div>
  <h1>Oops! Page Not Found</h1>
  <p>The page or resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
  <a href="/" class="btn">🏠 Return to Sreyas Assistant</a>
</div>

</body>
</html>
